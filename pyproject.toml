[project]
name = "mira"
dynamic = ["version"]
description = "Minimal Iterative Reasoning Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1,<1",
    "coolname>=5.0.0",
    "deepagents==0.7.38",
    "fastmcp>=4.2.0,<5",
    "langchain[mcp]==1.5.0",
    "langchain-quickjs==0.3.12",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "langchain-anyllm>=0.0.1a2",
    "lmstudio>=1.5.0",
    "pyfiglet>=1.0.4",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "textual==8.2.8",
    "typer>=0.29.1,<0.30.0",
]

[project.optional-dependencies]
acp = [
    "agent-client-protocol==0.12.1",
]
acp-http = [
    "agent-client-protocol[http]==0.12.1",
    "hypercorn>=0.18.0",
]
tracing = [
    "langsmith>=0.14.17,<0.15.0",
    "openinference-instrumentation>=0.1.77,<0.2.0",
    "openinference-semantic-conventions>=0.1.44,<0.2.0",
    "opentelemetry-sdk>=1.45.2,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2.0.0",
]
all = [
    "agent-client-protocol[http]==0.12.1",
    "hypercorn>=0.18.0",
    "langsmith>=0.14.17,<0.15.0",
    "openinference-instrumentation>=0.1.77,<0.2.0",
    "openinference-semantic-conventions>=0.1.44,<0.2.0",
    "opentelemetry-sdk>=1.45.2,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2.0.0",
]

[project.scripts]
mira = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "cli", "config", "core", "mira", "protocols", "session", "tracing", "ui"]

[tool.hatch.build.targets.wheel.force-include]
"mira_tool_api.py" = "mira_tool_api.py"
".env.example" = ".env.example"
"examples" = "agent/resources/project_kit/examples"

[tool.hatch.version]
path = "config/version.py"
